name: Build installers

on:
  # Ejecución manual desde la pestaña Actions de GitHub
  workflow_dispatch:

  # Automático en cada push a main o al crear un tag v*
  push:
    branches:
      - main
    tags:
      - 'v*'

# Permiso necesario para crear GitHub Releases
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact_name: AureaCertificados-mac
            artifact_glob: release/*.dmg

          - os: windows-latest
            platform: win
            artifact_name: AureaCertificados-win
            artifact_glob: release/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Instala sin compilar módulos nativos todavía
      - name: Instalar dependencias (sin scripts nativos)
        run: npm install --ignore-scripts

      # Descarga el binario de Electron si --ignore-scripts lo saltó
      - name: Asegurar binario de Electron
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Recompila better-sqlite3 y keytar contra el Node de Electron
      - name: Recompilar módulos nativos contra Electron
        run: npx @electron/rebuild

      # Build de la app + generación del instalador
      - name: Generar instalador
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Publica el instalador en GitHub Releases (solo cuando se crea un tag v*)
      # Los releases son públicos → enlace de descarga directo sin necesidad de GitHub
      - name: Publicar en GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sube el instalador como artefacto descargable en GitHub (todos los builds)
      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 30
          if-no-files-found: error
